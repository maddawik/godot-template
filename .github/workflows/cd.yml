name: CD 🚀

on:
  push:
    tags:
      - "v*"

env:
  GODOT_VERSION: "4.7.2"
jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      godot-version: "4.7.2"
  export-game:
    permissions:
      contents: write
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true
      - name: Export Game
        run: |
          make import
          make build
      - name: Upload HTML5
        uses: actions/upload-artifact@v4
        with:
          name: HTML5
          path: out/HTML5.zip
      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: Linux
          path: out/Linux.zip
      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: Windows
          path: out/Windows.zip
      - name: Upload MacOS
        uses: actions/upload-artifact@v4
        with:
          name: macOS
          path: out/MacOS.zip
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
          files: out/*.zip

  deploy-to-itchio:
    runs-on: ubuntu-latest
    needs: export-game
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: HTML5
            channel: web
            package: HTML5.zip
          - artifact: Linux
            channel: linux
            package: Linux.zip
          - artifact: Windows
            channel: windows
            package: Windows.zip
          - artifact: macOS
            channel: mac
            package: MacOS.zip
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
      - name: Deploy to Itch.io (${{ matrix.artifact }})
        uses: yeslayla/butler-publish-itchio-action@483157ebeeeb440e2fdc9f162f3fcfc27028c0ef # v1.2.0
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
          CHANNEL: ${{ matrix.channel }}
          ITCH_GAME: ${{ vars.ITCH_GAME }}
          ITCH_USER: ${{ vars.ITCH_NAME }}
          VERSION: ${{ github.ref_name }}
          PACKAGE: ${{ matrix.package }}
